name: OfficeFlow Neon Off-site Backup

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: officeflow-neon-offsite-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check backup credentials
        id: config
        shell: bash
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          YC_BUCKET: ${{ vars.YC_BUCKET }}
          YC_PREFIX: ${{ vars.YC_PREFIX }}
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$NEON_CONNECTION_STRING" || -z "$YC_BUCKET" || -z "$YC_ACCESS_KEY_ID" || -z "$YC_SECRET_ACCESS_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Off-site backup not configured"
              echo "Add the required GitHub Actions secrets and variables described in docs/EXTERNAL_OPERATIONS.md."
              echo "No database connection or upload was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Backup skipped because required Neon/Yandex Object Storage settings are not configured."
            exit 0
          fi
          case "$NEON_CONNECTION_STRING" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::NEON_CONNECTION_STRING must be a PostgreSQL URI."; exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Dump Neon and verify a full restore in a disposable PostgreSQL instance
        if: steps.config.outputs.configured == 'true'
        id: dump
        shell: bash
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          set -Eeuo pipefail
          backup_dir="$RUNNER_TEMP/officeflow-backup"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup_dir"
          chmod 0700 "$backup_dir"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

          docker run --rm \
            --env NEON_CONNECTION_STRING \
            --env BACKUP_STAMP="$stamp" \
            --volume "$backup_dir:/backup" \
            postgres:17 \
            sh -euc '
              pg_dump --no-password "$NEON_CONNECTION_STRING" \
                --format=custom --no-owner --no-acl \
                --file="/backup/officeflow-${BACKUP_STAMP}.dump"
              pg_restore --list "/backup/officeflow-${BACKUP_STAMP}.dump" >/dev/null
              cd /backup
              sha256sum "officeflow-${BACKUP_STAMP}.dump" > "officeflow-${BACKUP_STAMP}.dump.sha256"
            '

          # Prove that the dump can be restored, not merely listed.
          network="officeflow-backup-verify"
          container="officeflow-backup-restore-db"
          restore_password="RestoreOnly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run -d --name "$container" --network "$network" \
            -e POSTGRES_DB=officeflow_restore \
            -e POSTGRES_USER=restore \
            -e POSTGRES_PASSWORD="$restore_password" \
            postgres:17 >/dev/null

          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U restore -d officeflow_restore >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          docker run --rm --network "$network" \
            -e RESTORE_PASSWORD="$restore_password" \
            -e BACKUP_STAMP="$stamp" \
            --volume "$backup_dir:/backup:ro" \
            postgres:17 sh -euc '
              db="postgresql://restore:${RESTORE_PASSWORD}@officeflow-backup-restore-db:5432/officeflow_restore"
              pg_restore --no-password --exit-on-error --no-owner --no-acl \
                --dbname="$db" "/backup/officeflow-${BACKUP_STAMP}.dump"
              table_count="$(psql --no-password -Atc "SELECT count(*) FROM pg_tables WHERE schemaname = current_schema()" "$db")"
              test "$table_count" -gt 0
              echo "RESTORE_TEST_OK: restored $table_count public tables in a disposable PostgreSQL instance."
            '

      - name: Upload dump and checksum to private Yandex Object Storage, then verify remote copy
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_S3_ADDRESSING_STYLE: path
          AWS_EC2_METADATA_DISABLED: "true"
          YC_BUCKET: ${{ vars.YC_BUCKET }}
          YC_PREFIX: ${{ vars.YC_PREFIX }}
          
          BACKUP_STAMP: ${{ steps.dump.outputs.stamp }}
        run: |
          set -Eeuo pipefail
          backup_dir="$RUNNER_TEMP/officeflow-backup"
          docker run --rm --entrypoint /bin/sh \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e AWS_DEFAULT_REGION -e AWS_EC2_METADATA_DISABLED \
            -e AWS_S3_ADDRESSING_STYLE -e YC_BUCKET -e YC_PREFIX -e BACKUP_STAMP \
            --volume "$backup_dir:/backup" \
            amazon/aws-cli:2 -euc '
              endpoint="https://storage.yandexcloud.net"
              prefix="${YC_PREFIX:-officeflow/daily}"
              name="officeflow-${BACKUP_STAMP}.dump"
              destination="s3://${YC_BUCKET}/${prefix}/${name}"

              aws s3 cp "/backup/${name}" "$destination" \
                --endpoint-url "$endpoint" --only-show-errors
              aws s3 cp "/backup/${name}.sha256" "${destination}.sha256" \
                --endpoint-url "$endpoint" --only-show-errors

              mkdir -p /backup/remote-verify
              aws s3 cp "$destination" "/backup/remote-verify/${name}" \
                --endpoint-url "$endpoint" --only-show-errors
              aws s3 cp "${destination}.sha256" "/backup/remote-verify/${name}.sha256" \
                --endpoint-url "$endpoint" --only-show-errors
              cd /backup/remote-verify
              sha256sum -c "${name}.sha256"
              echo "OFFSITE_BACKUP_OK: Yandex Object Storage upload, remote download and SHA-256 verification passed."
            '

          {
            echo "## Off-site backup successful"
            echo "- Backup file: officeflow-$BACKUP_STAMP.dump"
            echo "- Destination: private Yandex Object Storage bucket (URI intentionally omitted)."
            echo "- Full restore test: passed in a disposable PostgreSQL 17 instance."
            echo "- Remote SHA-256 verification: passed."
          } >> "$GITHUB_STEP_SUMMARY"
