name: OfficeFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: officeflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: officeflow
          POSTGRES_PASSWORD: officeflow-ci-only
          POSTGRES_DB: officeflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U officeflow -d officeflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-only-not-production-key"
      DB_HOST: localhost
      DB_NAME: officeflow_test
      DB_USER: officeflow
      DB_PASSWORD: officeflow-ci-only
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Bandit security scan
        run: bandit -q -r workspace -x workspace/migrations,workspace/tests
      - name: Static project structure audit
        run: python scripts/static_audit.py
      - name: Compile operational helper scripts
        run: python -m py_compile scripts/render_alertmanager_config.py scripts/uptime_probe.py scripts/uptime_report.py
      - name: Django checks
        run: python manage.py check
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn
      - name: Django production security checks
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-only-production-check-key-0123456789-abcdef-0123456789-abcdef"
          DB_PASSWORD: "ci-only-production-database-password-0123456789"
          ALLOWED_HOSTS: officeflow.example.test
          CSRF_TRUSTED_ORIGINS: https://officeflow.example.test
          COOKIE_SECURE: "1"
          SECURE_SSL_REDIRECT: "1"
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Test suite and critical-module coverage
        run: pytest -q --cov=workspace.services --cov=workspace.queries --cov-report=term-missing --cov-fail-under=70
      - name: Package source artifact
        uses: actions/upload-artifact@v6
        with:
          name: officeflow-source
          path: .
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build Render image and verify production Django settings
        run: |
          docker build -f Dockerfile.render -t officeflow-render-ci .
          docker run --rm --entrypoint python             -e DJANGO_SETTINGS_MODULE=officeflow.settings_render             -e RENDER_EXTERNAL_HOSTNAME=officeflow-ci.onrender.com             -e RENDER_SECRET_KEY=ci-only-render-test-secret-0123456789abcdefghijklmnopqrstuvwxyz             -e NEON_HOST=ep-test.eu-central-1.aws.neon.tech             -e NEON_DATABASE=neondb             -e NEON_USER=neondb_owner             -e NEON_PASSWORD=ci-only-render-neon-password-32chars             officeflow-render-ci manage.py check --deploy
          docker run --rm --entrypoint python             -e DJANGO_SETTINGS_MODULE=officeflow.settings_render             -e RENDER_EXTERNAL_HOSTNAME=officeflow-ci.onrender.com             -e RENDER_SECRET_KEY=ci-only-render-test-secret-0123456789abcdefghijklmnopqrstuvwxyz             -e NEON_HOST=ep-test.eu-central-1.aws.neon.tech             -e NEON_DATABASE=neondb             -e NEON_USER=neondb_owner             -e NEON_PASSWORD=ci-only-render-neon-password-32chars             officeflow-render-ci manage.py collectstatic --noinput
      - name: Prepare production Compose environment
        run: cp .env.production.example .env
      - name: Validate production Compose configuration
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e DOMAIN=officeflow.example.test \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate Alertmanager configurations
        run: |
          config_dir="$(mktemp -d)"
          chmod 755 "$config_dir"
          trap 'rm -rf "$config_dir"' EXIT
          docker run --rm \
            -v "$PWD/scripts/render_alertmanager_config.py:/render.py:ro" \
            -v "$config_dir:/out" \
            -e ALERTMANAGER_WEBHOOK_URL= \
            python:3.12-alpine python /render.py --output /out/alertmanager.yml
          docker run --rm --entrypoint amtool \
            -v "$config_dir:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm \
            -v "$PWD/scripts/render_alertmanager_config.py:/render.py:ro" \
            -v "$config_dir:/out" \
            -e ALERTMANAGER_WEBHOOK_URL=https://hooks.example.test/officeflow \
            -e ALERTMANAGER_WEBHOOK_BEARER_TOKEN=ci-only-token \
            python:3.12-alpine python /render.py --output /out/alertmanager.yml
          docker run --rm --entrypoint amtool \
            -v "$config_dir:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm \
            -v "$PWD/scripts/render_alertmanager_config.py:/render.py:ro" \
            -v "$config_dir:/out" \
            -e ALERTMANAGER_TELEGRAM_BOT_TOKEN=123456:ci-only-token \
            -e ALERTMANAGER_TELEGRAM_CHAT_ID=123456789 \
            python:3.12-alpine python /render.py --output /out/alertmanager.yml
          docker run --rm --entrypoint amtool \
            -v "$config_dir:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Check shell scripts
        run: |
          sh -n docker-entrypoint.sh
          sh -n scripts/render-start.sh
          bash -n scripts/backup.sh
          bash -n scripts/test-restore.sh
          bash -n scripts/test-restore-independent.sh
      - uses: docker/setup-buildx-action@v4
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and (main only) push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Prepare image for runtime smoke test
        run: |
          image="${{ steps.image.outputs.name }}"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker pull "$image:sha-$GITHUB_SHA"
          fi
          docker tag "$image:sha-$GITHUB_SHA" officeflow-app
          cp .env.example .env
          # Browser tests resolve the reverse proxy by its Compose service name.
          sed -i 's/^ALLOWED_HOSTS=.*/ALLOWED_HOSTS=localhost,127.0.0.1,app,proxy/' .env
      - name: Smoke test app startup, health and static files
        run: |
          docker compose up -d --no-build
          ready=0
          for attempt in $(seq 1 60); do
            if docker compose exec -T app python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready/", timeout=2)' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker compose exec -T app python manage.py migrate --noinput
          docker compose exec -T app python -c 'from pathlib import Path; assert any(p.is_file() for p in Path("/app/staticfiles").rglob("*"))'
          asset_path="$(docker compose exec -T app python -c 'import os; os.environ.setdefault("DJANGO_SETTINGS_MODULE", "officeflow.settings"); import django; django.setup(); from django.templatetags.static import static; print(static("css/app.css"))' | tr -d '\r')"
          case "$asset_path" in
            /static/*) ;;
            *) echo "Unexpected static URL: $asset_path"; exit 1 ;;
          esac
          html="$(curl -fsS http://127.0.0.1:8080/accounts/login/)"
          printf '%s' "$html" | grep -F "$asset_path" >/dev/null
          curl -fsS "http://127.0.0.1:8080$asset_path" -o /dev/null
          echo "Container startup, health, and static serving passed."
      - name: Seed isolated browser-test data
        env:
          DEMO_PASSWORD: "OfficeFlow-CI-Demo-Only-2026!"
          LOADTEST_USERS: "16"
        run: |
          docker compose exec -T \
            -e "DEMO_PASSWORD=$DEMO_PASSWORD" \
            -e "LOADTEST_USERS=$LOADTEST_USERS" \
            app python manage.py seed_demo
      - name: Build Chromium browser-test image
        run: docker build -f e2e/Dockerfile.browser -t officeflow-e2e e2e
      - name: Run Chromium browser smoke tests
        env:
          DEMO_PASSWORD: "OfficeFlow-CI-Demo-Only-2026!"
        run: |
          mkdir -p "$RUNNER_TEMP/officeflow-e2e-artifacts"
          docker run --rm --ipc=host --network officeflow_internal \
            -e BASE_URL=http://proxy \
            -e K6_USERNAME=employee \
            -e K6_PASSWORD="$DEMO_PASSWORD" \
            -v "$RUNNER_TEMP/officeflow-e2e-artifacts:/tests/artifacts" \
            officeflow-e2e
      - name: Run isolated multi-session booking write-load test
        env:
          DEMO_PASSWORD: "OfficeFlow-CI-Demo-Only-2026!"
        run: |
          room_id="$(docker compose exec -T app python -c 'import os; os.environ.setdefault("DJANGO_SETTINGS_MODULE", "officeflow.settings"); import django; django.setup(); from workspace.models import Room; print(Room.objects.get(slug="mayak").pk)' | tr -d '\r')"
          test -n "$room_id"
          docker run --rm --network officeflow_internal \
            -e BASE_URL=http://proxy \
            -e K6_PASSWORD="$DEMO_PASSWORD" \
            -e K6_ROOM_ID="$room_id" \
            -e TARGET_RPS=8 \
            -e DURATION=30s \
            -v "$PWD/scripts/loadtest-booking-write.js:/scripts/loadtest-booking-write.js:ro" \
            grafana/k6:0.52.0 run /scripts/loadtest-booking-write.js
      - name: Upload browser E2E screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: officeflow-browser-e2e
          path: ${{ runner.temp }}/officeflow-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify independent PostgreSQL backup and restore
        run: |
          export BACKUP_DIR="$RUNNER_TEMP/officeflow-independent-dr"
          trap 'rm -rf "$BACKUP_DIR"' EXIT
          bash scripts/backup.sh
          dump="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.dump' -print -quit)"
          test -n "$dump"
          bash scripts/test-restore-independent.sh "$dump"
      - name: Exercise database and Redis failure recovery
        run: |
          wait_for_readiness() {
            expected="$1"
            for attempt in $(seq 1 60); do
              actual="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready/ || true)"
              if [[ "$actual" == "$expected" ]]; then
                echo "Readiness returned HTTP $expected as expected."
                return 0
              fi
              sleep 1
            done
            echo "Expected readiness HTTP $expected, last received $actual." >&2
            return 1
          }

          docker compose stop db
          wait_for_readiness 503
          docker compose start db
          wait_for_readiness 200

          docker compose stop redis
          wait_for_readiness 503
          docker compose start redis
          wait_for_readiness 200
      - name: Validate Prometheus, exporters, Alertmanager and provisioned Grafana dashboard
        run: |
          set -Eeuo pipefail
          export GRAFANA_USER=admin
          export GRAFANA_PASSWORD=OfficeFlow-CI-Only-Grafana-Password-2026
          docker compose --profile observability up -d

          wait_http() {
            url="$1"
            for attempt in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null; then
                echo "Ready: $url"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }

          wait_http http://127.0.0.1:9090/-/ready
          wait_http http://127.0.0.1:9093/-/ready
          wait_http http://127.0.0.1:3000/api/health

          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          base = "http://127.0.0.1:9090"
          expected_jobs = {"officeflow", "postgres", "redis"}
          last = {}
          for _ in range(30):
              with urllib.request.urlopen(base + "/api/v1/targets", timeout=5) as response:
                  payload = json.load(response)
              active = payload["data"]["activeTargets"]
              last = {target["labels"].get("job"): target["health"] for target in active}
              if all(last.get(job) == "up" for job in expected_jobs):
                  break
              time.sleep(2)
          missing = {job: last.get(job, "missing") for job in expected_jobs if last.get(job) != "up"}
          if missing:
              raise SystemExit(f"Prometheus scrape targets are not healthy: {missing}")
          print("Prometheus scrape targets are UP:", ", ".join(sorted(expected_jobs)))

          required_queries = {
              "PostgreSQL connections": "count(pg_stat_database_numbackends)",
              "PostgreSQL transactions": "count(pg_stat_database_xact_commit)",
              "Redis memory": "count(redis_memory_used_bytes)",
              "Redis clients": "count(redis_connected_clients)",
              "Redis commands": "count(redis_commands_processed_total)",
          }
          for label, expression in required_queries.items():
              query = urllib.parse.urlencode({"query": expression})
              with urllib.request.urlopen(base + "/api/v1/query?" + query, timeout=10) as response:
                  result = json.load(response)
              if not result.get("data", {}).get("result"):
                  raise SystemExit(f"Prometheus metric unavailable: {label} ({expression})")
              print("Metric available:", label)

          grafana = "http://127.0.0.1:3000/api/dashboards/uid/officeflow-reliability"
          request = urllib.request.Request(grafana)
          import base64
          credentials = base64.b64encode(
              ( "admin:" + "OfficeFlow-CI-Only-Grafana-Password-2026").encode()
          ).decode()
          request.add_header("Authorization", "Basic " + credentials)
          dashboard = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(request, timeout=5) as response:
                      dashboard = json.load(response)["dashboard"]
                  break
              except Exception:
                  time.sleep(2)
          if dashboard is None:
              raise SystemExit("Provisioned Grafana dashboard OfficeFlow Reliability was not found")
          titles = {panel.get("title") for panel in dashboard.get("panels", [])}
          required_panels = {
              "HTTP RPS", "HTTP p95 latency (seconds)", "5xx error rate",
              "Infrastructure availability", "PostgreSQL connections",
              "PostgreSQL transaction rate", "Redis memory",
              "Redis connected clients", "Redis commands per second",
          }
          missing_panels = required_panels - titles
          if missing_panels:
              raise SystemExit(f"Grafana dashboard is missing panels: {sorted(missing_panels)}")
          print(f"Grafana dashboard provisioned with {len(titles)} panels.")
          PY

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v --remove-orphans

  scale-validation:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'scale-validation/')
    uses: ./.github/workflows/scale-validation.yml
