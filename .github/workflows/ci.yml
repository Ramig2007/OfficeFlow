name: OfficeFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: officeflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: officeflow
          POSTGRES_PASSWORD: officeflow-ci-only
          POSTGRES_DB: officeflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U officeflow -d officeflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-only-not-production-key"
      DB_HOST: localhost
      DB_NAME: officeflow_test
      DB_USER: officeflow
      DB_PASSWORD: officeflow-ci-only
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Bandit security scan
        run: bandit -q -r workspace -x workspace/migrations,workspace/tests
      - name: Static project structure audit
        run: python scripts/static_audit.py
      - name: Django checks
        run: python manage.py check
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn
      - name: Django production security checks
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-only-production-check-key-0123456789-abcdef-0123456789-abcdef"
          DB_PASSWORD: "ci-only-production-database-password-0123456789"
          ALLOWED_HOSTS: officeflow.example.test
          CSRF_TRUSTED_ORIGINS: https://officeflow.example.test
          COOKIE_SECURE: "1"
          SECURE_SSL_REDIRECT: "1"
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Test suite and critical-module coverage
        run: pytest -q --cov=workspace.services --cov=workspace.queries --cov-report=term-missing --cov-fail-under=70
      - name: Package source artifact
        uses: actions/upload-artifact@v6
        with:
          name: officeflow-source
          path: .
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare production Compose environment
        run: cp .env.production.example .env
      - name: Validate production Compose configuration
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e DOMAIN=officeflow.example.test \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check shell scripts
        run: |
          sh -n docker-entrypoint.sh
          bash -n scripts/backup.sh
          bash -n scripts/test-restore.sh
      - uses: docker/setup-buildx-action@v4
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and (main only) push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Prepare image for runtime smoke test
        run: |
          image="${{ steps.image.outputs.name }}"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker pull "$image:sha-$GITHUB_SHA"
          fi
          docker tag "$image:sha-$GITHUB_SHA" officeflow-app
          cp .env.example .env
      - name: Smoke test app startup, health and static files
        run: |
          docker compose up -d --no-build
          ready=0
          for attempt in $(seq 1 60); do
            if docker compose exec -T app python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready/", timeout=2)' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker compose exec -T app python manage.py migrate --noinput
          docker compose exec -T app python -c 'from pathlib import Path; assert any(p.is_file() for p in Path("/app/staticfiles").rglob("*"))'
          asset_path="$(docker compose exec -T app python -c 'import os; os.environ.setdefault("DJANGO_SETTINGS_MODULE", "officeflow.settings"); import django; django.setup(); from django.templatetags.static import static; print(static("css/app.css"))' | tr -d '\r')"
          case "$asset_path" in
            /static/*) ;;
            *) echo "Unexpected static URL: $asset_path"; exit 1 ;;
          esac
          html="$(curl -fsS http://127.0.0.1:8080/accounts/login/)"
          printf '%s' "$html" | grep -F "$asset_path" >/dev/null
          curl -fsS "http://127.0.0.1:8080$asset_path" -o /dev/null
          echo "Container startup, health, and static serving passed."
      - name: Stop smoke stack
        if: always()
        run: docker compose down -v --remove-orphans
