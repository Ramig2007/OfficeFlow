name: OfficeFlow CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: officeflow
          POSTGRES_PASSWORD: officeflow-ci-only
          POSTGRES_DB: officeflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U officeflow -d officeflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-only-not-production-key"
      DB_HOST: localhost
      DB_NAME: officeflow_test
      DB_USER: officeflow
      DB_PASSWORD: officeflow-ci-only
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - run: pytest -q --cov=workspace.services --cov=workspace.queries --cov-report=term-missing --cov-fail-under=70
      - name: Package source artifact
        uses: actions/upload-artifact@v4
        with: {name: officeflow-source, path: '.'}
  docker:
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image tag
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and (main only) push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}
