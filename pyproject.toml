[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "officeflow.settings"
python_files = ["test_*.py"]
testpaths = ["workspace/tests"]
addopts = "-ra"
markers = ["e2e: end-to-end browser test requires a running demo server"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["workspace/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["workspace"]
omit = ["*/migrations/*", "*/tests/*", "*/management/*"]

[tool.coverage.report]
show_missing = true
